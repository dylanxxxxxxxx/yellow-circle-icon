<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纯黄圆形图标</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    .icon {
      width: 128px;
      height: 128px;
      background: #ffff00;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="icon" role="img" aria-label="纯黄色圆形图标"></div>
</body>
</html>
